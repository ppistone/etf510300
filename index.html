<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF 每日总份额 / 累计净值查询 · 看板导航</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#1f2d3d; }
  .app { display:flex; height:100vh; overflow:hidden; }
  .side { width:264px; flex:0 0 264px; background:#0f2a4a; color:#fff; display:flex; flex-direction:column; }
  .brand { padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
  .brand p { margin:8px 0 0; font-size:12px; line-height:1.6; color:#9db8d6; }
  .nav { padding:12px 12px 4px; flex:1; overflow:auto; }
  .nav .grp { font-size:11px; color:#6f8aad; padding:10px 6px 4px; letter-spacing:1px; }
  .item { display:block; width:100%; text-align:left; background:transparent; border:0; color:#dbe7f5; padding:11px 14px; border-radius:10px; cursor:pointer; margin:4px 0; transition:.15s; font-family:inherit; }
  .item:hover { background:rgba(255,255,255,.07); }
  .item.active { background:#2a62b4; color:#fff; box-shadow:0 2px 10px rgba(42,98,180,.5); }
  .item .code { font-size:12px; color:#8fb0d6; }
  .item.active .code { color:#d8e6f7; }
  .item .name { font-size:14px; font-weight:600; margin-top:3px; }
  .item .mkt { font-size:11px; color:#7fa0c6; margin-top:2px; }
  .item.active .mkt { color:#cfe0f5; }
  .foot { padding:14px 18px; font-size:11.5px; line-height:1.6; color:#8aa0bd; border-top:1px solid rgba(255,255,255,.08); }
  .main { flex:1; min-width:0; background:#eef1f6; }
  .main iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>ETF 份额 / 净值看板</h1>
      <p>选择基金，右侧自动显示对应页面</p>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">单只 ETF</div>
    </nav>
    <div class="foot">数据：上交所 / 深交所 / 天天基金公开库<br>每晚 23:30 自动更新</div>
  </aside>
  <div class="main">
    <iframe id="frame" src="index_510300.html" title="看板"></iframe>
  </div>
</div>
<script>
  const funds = [
    {code:"510300", name:"沪深300ETF 华泰柏瑞", mkt:"沪市", file:"index_510300.html"},
    {code:"510500", name:"中证500ETF 南方",    mkt:"沪市", file:"index_510500.html"},
    {code:"159915", name:"创业板ETF 易方达",   mkt:"深市", file:"index_159915.html"},
  ];
  const nav = document.getElementById('nav');
  funds.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'item' + (i === 0 ? ' active' : '');
    b.innerHTML = `<div class="code">${f.code}</div><div class="name">${f.name}</div><div class="mkt">${f.mkt}</div>`;
    b.onclick = () => {
      document.getElementById('frame').src = f.file;
      [...nav.querySelectorAll('.item')].forEach(c => c.classList.remove('active'));
      b.classList.add('active');
    };
    nav.appendChild(b);
  });
  const sep = document.createElement('div');
  sep.className = 'grp'; sep.textContent = '对比';
  nav.appendChild(sep);
  const b2 = document.createElement('button');
  b2.className = 'item';
  b2.innerHTML = `<div class="code">510300 / 510310 / 510330 / 159919</div><div class="name">沪深300ETF 四只对比</div><div class="mkt">跨市场</div>`;
  b2.onclick = () => {
    document.getElementById('frame').src = 'index_multi.html';
    [...nav.querySelectorAll('.item')].forEach(c => c.classList.remove('active'));
    b2.classList.add('active');
  };
  nav.appendChild(b2);
</script>
</body>
</html>
